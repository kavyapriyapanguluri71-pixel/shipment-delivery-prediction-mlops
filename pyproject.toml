[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shipment-delivery-mlops"
version = "1.0.0"
description = "Reproducible shipment delivery prediction pipeline and API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "pandas>=2.2,<4",
    "scikit-learn>=1.6,<2",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

